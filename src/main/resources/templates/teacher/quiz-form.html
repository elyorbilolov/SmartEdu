<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Yangi Test')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white border-bottom p-4">
                    <h4 class="fw-bold mb-0"><i class="bi bi-patch-question me-2 text-primary"></i> Yangi Onlayn Test Tuzish</h4>
                    <p class="text-muted small mb-0">Fan: <span class="fw-semibold text-dark" th:text="${course.title}">Fan</span></p>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{'/teacher/courses/' + ${course.id} + '/quizzes/new'}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Test Nomi *</label>
                            <input type="text" class="form-control" name="title" placeholder="Masalan: Oraliq Nazorat Testi" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Ajratilgan Vaqt (daqiqa) *</label>
                            <input type="number" class="form-control" name="timeLimitMinutes" value="15" min="5" max="180" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Test Tavsifi va Qoidalari</label>
                            <textarea class="form-control" name="description" rows="3" placeholder="Test savollari soni, qoidalar va shartlar..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{'/teacher/courses/' + ${course.id}}" class="btn btn-light border"><i class="bi bi-arrow-left me-1"></i> Orqaga</a>
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-arrow-right me-1"></i> Davom etish (Savollar qo'shish)</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
