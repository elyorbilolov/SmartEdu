<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ro\'yxatdan o\'tish')}"></head>
<body class="bg-light">

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold">Ro'yxatdan o'tish</h3>
                        <p class="text-muted small">«SmartEdu» tizimidan yangi hisob ochish</p>
                    </div>

                    <form th:action="@{/register}" method="post">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="fullName" class="form-label fw-semibold">F.I.Sh (To'liq ism-familiya) *</label>
                                <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Masalan: Sardor Mahmudov" required>
                            </div>

                            <div class="col-md-6">
                                <label for="username" class="form-label fw-semibold">Login (Foydalanuvchi nomi) *</label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Login yarating" required>
                            </div>

                            <div class="col-md-6">
                                <label for="role" class="form-label fw-semibold">Foydalanuvchi roli *</label>
                                <select class="form-select" id="role" name="role" required>
                                    <option value="ROLE_STUDENT" selected>Talaba</option>
                                    <option value="ROLE_TEACHER">O'qituvchi</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Elektron pochta</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="example@mail.uz">
                            </div>

                            <div class="col-md-6">
                                <label for="phoneNumber" class="form-label fw-semibold">Telefon raqam</label>
                                <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" placeholder="+998 90 123 45 67">
                            </div>

                            <div class="col-md-6">
                                <label for="password" class="form-label fw-semibold">Parol *</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Parol" required minlength="4">
                            </div>

                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label fw-semibold">Parolni tasdiqlash *</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Parolni qaytaring" required minlength="4">
                            </div>

                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                    <i class="bi bi-person-check me-1"></i> Ro'yxatdan o'tish
                                </button>
                            </div>
                        </div>
                    </form>

                    <div class="text-center mt-4 text-muted small">
                        Allaqachon hisobingiz bormi? <a th:href="@{/login}" class="text-primary fw-semibold">Kirish</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
