<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mening profilim')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white border-bottom p-4">
                    <div class="d-flex align-items-center gap-3">
                        <div class="fs-1 text-primary"><i class="bi bi-person-badge-fill"></i></div>
                        <div>
                            <h4 class="fw-bold mb-0" th:text="${user.fullName}">Foydalanuvchi</h4>
                            <span class="badge" th:classappend="${user.role.name() == 'ROLE_ADMIN' ? 'bg-danger' : (user.role.name() == 'ROLE_TEACHER' ? 'bg-warning text-dark' : 'bg-primary')}" th:text="${user.role.displayName}">Rol</span>
                            <span class="text-muted small ms-2">Login: <strong th:text="${user.username}">login</strong></span>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/profile}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">F.I.Sh</label>
                                <input type="text" class="form-control" name="fullName" th:value="${user.fullName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Elektron pochta</label>
                                <input type="email" class="form-control" name="email" th:value="${user.email}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Telefon raqam</label>
                                <input type="text" class="form-control" name="phoneNumber" th:value="${user.phoneNumber}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Yangi parol (ixtiyoriy)</label>
                                <input type="password" class="form-control" name="newPassword" placeholder="O'zgartirmaslik uchun bo'sh qoldiring">
                            </div>
                            <div class="col-12 mt-4 text-end">
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-save me-1"></i> Saqlash
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
