<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Yangi Fan Qo\'shish')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white border-bottom p-4">
                    <h4 class="fw-bold mb-0"><i class="bi bi-plus-circle me-2 text-primary"></i> Yangi Fan Qo'shish</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/courses/new}" method="post">
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Fan Nomi *</label>
                                <input type="text" class="form-control" name="title" placeholder="Masalan: Java Dasturlash Asoslari" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Fan Kodi *</label>
                                <input type="text" class="form-control" name="code" placeholder="CS101" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Kategoriya</label>
                                <input type="text" class="form-control" name="category" placeholder="Masalan: Dasturlash">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Kredit</label>
                                <input type="number" class="form-control" name="creditHours" value="4" min="1" max="10">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Semestr</label>
                                <input type="number" class="form-control" name="semester" value="1" min="1" max="8">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mas'ul O'qituvchi</label>
                            <select class="form-select" name="teacherId">
                                <option value="">-- O'qituvchini tanlang (ixtiyoriy) --</option>
                                <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.fullName} + ' (' + ${t.username} + ')'">O'qituvchi</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Fan Haqida Qisqacha Tavsif</label>
                            <textarea class="form-control" name="description" rows="3" placeholder="Fan maqsadi, vazifalari va mazmuni..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/admin/courses}" class="btn btn-light border"><i class="bi bi-arrow-left me-1"></i> Bekor qilish</a>
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i> Saqlash</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
