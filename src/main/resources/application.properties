# Application Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=SmartEdu Platform

# H2 Database Configuration (File-based storage so data persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/smartedu_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration (Accessible via /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# File Upload Settings (Max 50MB per file)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# Logging Configuration
logging.level.com.smartedu=INFO
logging.level.org.springframework.security=INFO
