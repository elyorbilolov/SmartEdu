<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Foydalanuvchini Tahrirlash')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white border-bottom p-4">
                    <h4 class="fw-bold mb-0"><i class="bi bi-pencil-square me-2 text-primary"></i> Foydalanuvchini Tahrirlash</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{'/admin/users/' + ${user.id} + '/edit'}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Login</label>
                            <input type="text" class="form-control" th:value="${user.username}" disabled readonly>
                            <small class="text-muted">Loginni o'zgartirib bo'lmaydi</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">F.I.Sh *</label>
                            <input type="text" class="form-control" name="fullName" th:value="${user.fullName}" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Rol *</label>
                                <select class="form-select" name="role" required>
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.displayName}" th:selected="${r == user.role}">Rol</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Holati</label>
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" name="enabled" value="true" th:checked="${user.enabled}" id="enabledSwitch">
                                    <label class="form-check-label" for="enabledSwitch">Faol hisob</label>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" name="email" th:value="${user.email}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Telefon</label>
                                <input type="text" class="form-control" name="phoneNumber" th:value="${user.phoneNumber}">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Yangi Parol (Agar o'zgartirilsa)</label>
                            <input type="password" class="form-control" name="newPassword" placeholder="Parol o'zgarmasligi uchun bo'sh qoldiring">
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/admin/users}" class="btn btn-light border"><i class="bi bi-arrow-left me-1"></i> Orqaga</a>
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-1"></i> Saqlash</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
