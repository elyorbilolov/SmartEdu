<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Yangi Foydalanuvchi')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white border-bottom p-4">
                    <h4 class="fw-bold mb-0"><i class="bi bi-person-plus me-2 text-primary"></i> Yangi Foydalanuvchi Qo'shish</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/users/new}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">F.I.Sh *</label>
                            <input type="text" class="form-control" name="fullName" placeholder="Masalan: Jasur Karimov" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Login *</label>
                                <input type="text" class="form-control" name="username" placeholder="Login" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Rol *</label>
                                <select class="form-select" name="role" required>
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.displayName}">Talaba</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" name="email" placeholder="example@smartedu.uz">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Telefon</label>
                                <input type="text" class="form-control" name="phoneNumber" placeholder="+998 90 123 45 67">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Boshlang'ich Parol *</label>
                            <input type="password" class="form-control" name="password" placeholder="Parol" required minlength="4">
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/admin/users}" class="btn btn-light border"><i class="bi bi-arrow-left me-1"></i> Bekor qilish</a>
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i> Saqlash</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
