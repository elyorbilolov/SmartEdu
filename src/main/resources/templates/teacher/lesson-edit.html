<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Darsni Tahrirlash')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white border-bottom p-4">
                    <h4 class="fw-bold mb-0"><i class="bi bi-pencil-square me-2 text-primary"></i> Darsni Tahrirlash</h4>
                    <p class="text-muted small mb-0">Fan: <span class="fw-semibold text-dark" th:text="${course.title}">Fan</span></p>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{'/teacher/courses/' + ${course.id} + '/lessons/' + ${lesson.id} + '/edit'}" method="post">
                        <div class="row mb-3">
                            <div class="col-md-9">
                                <label class="form-label fw-semibold">Dars Mavzusi *</label>
                                <input type="text" class="form-control" name="title" th:value="${lesson.title}" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Tartib raqami</label>
                                <input type="number" class="form-control" name="orderIndex" th:value="${lesson.orderIndex}" min="1">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Ma'ruza Matni / Dars Tafsilotlari</label>
                            <textarea class="form-control" name="content" rows="6" th:text="${lesson.content}"></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">YouTube Video Havolasi (ixtiyoriy)</label>
                            <input type="url" class="form-control" name="videoUrl" th:value="${lesson.videoUrl}">
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{'/teacher/courses/' + ${course.id}}" class="btn btn-light border"><i class="bi bi-arrow-left me-1"></i> Orqaga</a>
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-1"></i> Saqlash</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
