<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Barcha Fanlar')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-4">
    <!-- Search Banner -->
    <div class="card bg-white border-0 shadow-sm p-4 mb-4 rounded-4">
        <div class="row align-items-center">
            <div class="col-md-7">
                <h3 class="fw-bold mb-1"><i class="bi bi-grid-fill text-primary me-2"></i> Fanlar Katalogi</h3>
                <p class="text-muted mb-0">Platformadagi barcha fanlarni o'rganing va yangilariga a'zo bo'ling</p>
            </div>
            <div class="col-md-5 mt-3 mt-md-0">
                <form th:action="@{/student/courses}" method="get" class="d-flex gap-2">
                    <input type="text" class="form-control" name="search" placeholder="Fan nomi yoki kodi bo'yicha qidiruv..." th:value="${search}">
                    <button type="submit" class="btn btn-primary px-3"><i class="bi bi-search"></i></button>
                </form>
            </div>
        </div>
    </div>

    <!-- Courses Grid -->
    <div th:if="${courses.isEmpty()}" class="alert alert-light border text-center py-5">
        <i class="bi bi-search fs-1 text-muted d-block mb-3"></i>
        <h5 class="fw-bold text-muted">Fanlar topilmadi</h5>
        <p class="text-muted small">Qidiruv so'zini o'zgartirib ko'ring yoki barcha fanlarni oching</p>
        <a th:href="@{/student/courses}" class="btn btn-outline-primary btn-sm">Barcha fanlarni ko'rish</a>
    </div>

    <div class="row g-4" th:unless="${courses.isEmpty()}">
        <div th:each="c : ${courses}" class="col-md-6 col-lg-4">
            <div class="card h-100 card-hover border">
                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-secondary-subtle text-secondary" th:text="${c.category}">Kategoriya</span>
                        <span class="badge bg-primary-subtle text-primary fw-bold" th:text="${c.code}">CS101</span>
                    </div>
                    <h5 class="card-title fw-bold text-dark mb-2" th:text="${c.title}">Fan Nomi</h5>
                    <p class="card-text text-muted small flex-grow-1" th:text="${#strings.abbreviate(c.description, 80)}">Tavsif</p>

                    <hr class="my-3 text-muted">

                    <div class="d-flex justify-content-between align-items-center text-muted small mb-3">
                        <span><i class="bi bi-person me-1"></i> <span th:text="${c.teacher != null ? c.teacher.fullName : 'Biriktirilmagan'}">O'qituvchi</span></span>
                        <span><i class="bi bi-journal-text me-1"></i> <span th:text="${c.creditHours} + ' kredit'">4 kredit</span></span>
                    </div>

                    <div class="d-flex gap-2">
                        <a th:href="@{'/student/courses/' + ${c.id}}" class="btn btn-outline-primary flex-grow-1">
                            <i class="bi bi-eye me-1"></i> Ko'rish
                        </a>
                        <form th:if="${!enrolledIds.contains(c.id)}" th:action="@{'/student/courses/' + ${c.id} + '/enroll'}" method="post">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> A'zo bo'lish</button>
                        </form>
                        <span th:if="${enrolledIds.contains(c.id)}" class="badge bg-success-subtle text-success d-flex align-items-center px-3">
                            <i class="bi bi-check2 me-1"></i> A'zo
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
