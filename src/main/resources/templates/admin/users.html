<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Foydalanuvchilar')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-people-fill text-primary me-2"></i> Foydalanuvchilar Boshqaruvi</h3>
            <p class="text-muted mb-0">Tizimdagi barcha talaba, o'qituvchi va administratorlar ro'yxati</p>
        </div>
        <a th:href="@{/admin/users/new}" class="btn btn-primary">
            <i class="bi bi-person-plus me-1"></i> Yangi Foydalanuvchi
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>F.I.Sh</th>
                        <th>Login</th>
                        <th>Roli</th>
                        <th>Email & Tel</th>
                        <th>Holati</th>
                        <th class="text-end">Amallar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u, iter : ${users}">
                        <td th:text="${iter.count}">1</td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${u.fullName}">Ism Familiya</div>
                            <small class="text-muted" th:text="'Yaratilgan: ' + ${#temporals.format(u.createdAt, 'dd.MM.yyyy')}"></small>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${u.username}">username</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${u.role.name() == 'ROLE_ADMIN' ? 'bg-danger' : (u.role.name() == 'ROLE_TEACHER' ? 'bg-warning text-dark' : 'bg-primary')}" th:text="${u.role.displayName}">Rol</span>
                        </td>
                        <td>
                            <div class="small" th:text="${u.email != null ? u.email : '-'}">email</div>
                            <div class="small text-muted" th:text="${u.phoneNumber != null ? u.phoneNumber : '-'}">tel</div>
                        </td>
                        <td>
                            <span class="badge bg-success-subtle text-success" th:if="${u.enabled}"><i class="bi bi-check-circle me-1"></i> Faol</span>
                            <span class="badge bg-danger-subtle text-danger" th:unless="${u.enabled}"><i class="bi bi-x-circle me-1"></i> Bloklangan</span>
                        </td>
                        <td class="text-end">
                            <div class="btn-group btn-group-sm">
                                <a th:if="${u.role.name() == 'ROLE_STUDENT'}" th:href="@{'/reports/student/' + ${u.id} + '/transcript'}" class="btn btn-outline-danger" title="Reyting daftarchasini yuklash (PDF)">
                                    <i class="bi bi-file-earmark-pdf"></i>
                                </a>
                                <a th:href="@{'/admin/users/' + ${u.id} + '/edit'}" class="btn btn-outline-secondary" title="Tahrirlash">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:if="${u.username != 'admin'}" th:action="@{'/admin/users/' + ${u.id} + '/delete'}" method="post" class="d-inline" onsubmit="return confirm('Rostdan ham ushbu foydalanuvchini o\'chirmoqchimisiz?');">
                                    <button type="submit" class="btn btn-outline-danger" title="O'chirish">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
